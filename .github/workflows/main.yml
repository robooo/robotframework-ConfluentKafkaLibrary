# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Weekly run against the newest confluent-kafka release, to catch upstream breaking changes early
  schedule:
    - cron: '0 6 * * 1'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum: the lowest confluent-kafka allowed by pyproject.toml; latest: newest compatible release
        confluent-kafka: [minimum, latest]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Spin up kafka
        run: cd examples && docker compose up -d && cd ..
      # Isolate from the runner's system packages (walinuxagent, pyopenssl, ...),
      # otherwise `pip check` fails on conflicts unrelated to this library.
      - name: Create virtualenv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Upgrade pip, setuptools, and wheel
        run: python3 -m pip install --upgrade pip setuptools wheel
      - name: Install python requirements
        run: pip install --force-reinstall .[all]
      - name: Install minimum confluent-kafka
        if: matrix.confluent-kafka == 'minimum'
        run: |
          MIN=$(python3 -c "import re,tomllib; d=tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']; print(re.search(r'confluent-kafka\s*>=\s*([\w.]+)', ' '.join(d)).group(1))")
          pip install "confluent-kafka==$MIN"
      - name: Show confluent-kafka version
        run: python3 -c "import confluent_kafka; print(confluent_kafka.version(), confluent_kafka.libversion())"
      - name: Check for broken dependencies
        run: pip check
      - name: Wait for services
        run: while [ -n "$(docker container ls -a | grep starting)" ]; do sleep 2; done;
      - name: Docker inspect
        run:  docker inspect --format "{{json .State.Health.Status }}" $(docker compose -f examples/docker-compose.yml ps -q)
      - name: Show python version
        run: python3 --version
      - name: Execute tests
        run: cd examples && python3 -m robot -d ../docs .
      - name: Archive test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.confluent-kafka }}.html
          path: docs/log.html
